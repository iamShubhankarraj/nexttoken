appId: com.nexttoken.app
productName: Next Token
# Artifact names are URLs in the update feed, so they must be space-free and
# stable. Without this, `${productName}` puts a space in the filename
# ("Next Token-0.6.7-arm64-mac.zip") which then needs percent-encoding in
# latest-mac.yml. Matches the convention in RELEASE.md.
artifactName: Next-Token-${version}-${arch}-mac.${ext}
# Update-in-place: the app is ALWAYS "Next Token.app" with this ONE stable
# CFBundleIdentifier. Replacing the old .app in /Applications IS the update —
# macOS never sees a second app identity. Keep this ID forever.
# In-app updates (electron-updater, generic provider): fill in a release feed
# URL below when a server exists. Until then the "Check for updates" menu item
# degrades gracefully and the zip remains the distribution path.
#publish:
#  provider: generic
#  url: https://updates.nexttoken.app/mac-arm64/
directories:
  output: release
files:
  - dist/**/*
  - package.json
# Native sidecars (applefm-bridge — build on a Mac via native/applefm/build.sh).
# Lands at <resources>/sidecars/, resolved by AppleFmClient as the bundle
# fallback (the userData sidecars dir is the primary candidate now, since it
# survives app replacement on update).
extraResources:
  - from: resources/sidecars
    to: sidecars
  # Dictation cleanup prompt assets (Flow, MIT — see THIRD-PARTY-NOTICES.md).
  - from: resources/prompts
    to: prompts
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  category: public.app-category.productivity
  darkModeSupport: true
dmg:
  # backgroundColor (not background) so Linux builds don't need macOS `sips`.
  backgroundColor: "#0B0B0D"
  window:
    width: 540
    height: 380
  contents:
    - { x: 140, y: 180, type: link, path: /Applications }
    - { x: 400, y: 180, type: file }
npmRebuild: false
